[package]
name = "chia-query"
version = "0.24.0"
edition = "2021"
description = "Query the Chia blockchain via decentralized peers with coinset.org fallback"
license = "MIT"
repository = "https://github.com/DIG-Network/chia-query"
readme = "README.md"
keywords = ["chia", "blockchain", "coinset", "peer", "query"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[lib]
# `cdylib` for the wasm-pack build; `rlib` so native consumers + the drift bin
# + tests still link the crate normally.
crate-type = ["cdylib", "rlib"]

[features]
# `native` (default) is the full client: peer WebSockets + CLVM routing +
# reqwest, racing decentralized peers against the coinset.org fallback.
default = ["native"]
native = [
    "dep:chia-protocol",
    "dep:chia-consensus",
    "dep:chia-bls",
    "dep:chia-traits",
    "dep:chia-puzzle-types",
    "dep:clvm-traits",
    "dep:clvm-utils",
    "dep:clvmr",
    "dep:chia-wallet-sdk",
    "dep:chia-ssl",
    "dep:dig-chainsource-interface",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:reqwest",
    "dep:rand",
    "dep:futures-util",
    "dep:async-trait",
]
# `coinset` is the wasm-safe core: the coinset.org REST tier only, with its
# HTTP riding an injected `fetch` transport. Build it wasm-clean with
# `cargo build --target wasm32-unknown-unknown --no-default-features --features coinset`.
coinset = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:getrandom",
]

[dependencies]
# --- wasm-safe core (always compiled) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
log = "0.4"

# --- native-only (the peer + routing tiers) ---
# The chia component crates are taken DIRECTLY rather than through the `chia`
# umbrella: the umbrella has no 0.36 release (it jumps 0.32 -> 0.42), and the
# 0.36 family is the one `chia-wallet-sdk` 0.36 and `dig-chainsource-interface`
# 0.3 both build against. Keeping them separate is what lets every
# `chia_protocol` type in this crate be the SAME type those two expose.
chia-protocol = { version = "0.36", optional = true }
chia-consensus = { version = "0.36", optional = true }
chia-bls = { version = "0.36", optional = true }
chia-traits = { version = "0.36", optional = true }
chia-puzzle-types = { version = "0.36", optional = true }
clvm-traits = { version = "0.36", optional = true }
clvm-utils = { version = "0.36", optional = true }
# The canonical `ChainSource` provider interface chia-query implements + aggregates.
#
# `lineage-walk` supplies the ONE canonical launcher -> tip singleton walk. It is non-default in the
# dependency because it pulls a CLVM evaluator, and it is enabled HERE because `ChiaQueryProvider`
# serves `resolve_singleton_lineage` -- the trait's only method with no default body, and its most
# trust-critical. Without it this crate had to hand-roll the walk, and the hand-rolled copy fed only
# `coin_spend` into it, so it could not tell an unspent tip from a coin the source never knew and
# returned unverified successors as live state (#28). The whole dependency sits inside `native`, so
# the CLVM evaluator never reaches the wasm `coinset` build.
dig-chainsource-interface = { version = "0.3", features = ["lineage-walk"], optional = true }
clvmr = { version = "0.16", optional = true }
chia-wallet-sdk = { version = "0.36", features = ["native-tls"], optional = true }
# Generates the peer TLS client identity in memory, so a query client never needs a
# Chia installation on disk. Pinned to the 0.42.x chia-sdk-client 0.36 depends on, so
# `ChiaCertificate` is the SAME type `create_native_tls_connector` accepts. chia-ssl
# is versioned independently of the 0.36 chia family above and moved 0.36 -> 0.42
# under chia-wallet-sdk 0.36; this pin MUST track chia-sdk-client's, or the two
# `ChiaCertificate` types diverge and the connector call stops compiling.
chia-ssl = { version = "0.42", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
# `stream` (native-only) enables `bytes_stream()` for the transport-level response body cap.
# reqwest is a native-only optional dep, so this feature never reaches the wasm `coinset` build.
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
rand = { version = "0.8", optional = true }
futures-util = { version = "0.3", optional = true }
# The light client's `CoinStateFetcher` seam is an ASYNC trait consumed as `dyn`, which native
# `async fn` in traits cannot be (no vtable). The seam exists so the provider's fail-closed mapping
# is testable against an in-memory double instead of a live full node, so erasing it is the point.
async-trait = { version = "0.1", optional = true }

# --- wasm-only (the injected-fetch coinset transport + bindings) ---
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
# `getrandom` with the `js` backend keeps any transitive RNG wasm-clean.
getrandom = { version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
# Enables the in-memory `MockChainSource` for the provider-registry trust-model
# tests. This merges the `testing` feature onto the native dependency above.
dig-chainsource-interface = { version = "0.3", features = ["testing"] }
# The canonical singleton launcher/top-layer program bytes, so the lineage-walk
# tests build GENUINE singleton-family spends to exercise the singleton-shape gate
# (pinned to the same 0.20.3 `chia-wallet-sdk` 0.36 resolves).
chia-puzzles = "0.20.3"

[[bin]]
name = "coinset_drift"
required-features = ["native"]

# Linux-only vendored OpenSSL for the native TLS stack. Inert on wasm
# (target_os != "linux"), so it never reaches the coinset-only build.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
